name: Build & Test

on:
  push:
    branches: [ master, main, claude/** ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          git

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: ${{ runner.os }}-cmake-deps-${{ hashFiles('cmake/deps.cmake', 'cmake/deps/**') }}
        restore-keys: |
          ${{ runner.os }}-cmake-deps-

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCPM_SOURCE_CACHE="${GITHUB_WORKSPACE}/build/_deps"

    - name: Build
      run: cmake --build build --config Release --parallel $(nproc)

    - name: Run tests
      working-directory: build
      run: ctest --output-on-failure --verbose

    - name: Run e2e tests
      if: success() && hashFiles('build/warlock_e2e') != ''
      run: ./build/warlock_e2e
