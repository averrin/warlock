name: Build & Test

on:
  push:
    branches: [ master, main, claude/** ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git

    - name: Install latest CMake
      run: |
        wget -q https://github.com/Kitware/CMake/releases/download/v3.29.6/cmake-3.29.6-linux-x86_64.tar.gz
        tar xzf cmake-3.29.6-linux-x86_64.tar.gz
        sudo mv cmake-3.29.6-linux-x86_64 /opt/cmake
        sudo ln -sf /opt/cmake/bin/cmake /usr/bin/cmake
        sudo ln -sf /opt/cmake/bin/ctest /usr/bin/ctest

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: ${{ runner.os }}-cmake-deps-${{ hashFiles('cmake/deps.cmake', 'cmake/deps/**') }}
        restore-keys: |
          ${{ runner.os }}-cmake-deps-

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCPM_SOURCE_CACHE="${GITHUB_WORKSPACE}/build/_deps"

    - name: Build main executable and unit tests
      run: cmake --build build --config Release --parallel $(nproc) --target hellfrost warlock_unit warlock_serial

    - name: Run tests
      working-directory: build
      run: ctest --output-on-failure --verbose

    - name: Build e2e tests (optional)
      continue-on-error: true
      run: cmake --build build --config Release --target warlock_e2e

    - name: Run e2e tests if available
      if: success() && hashFiles('build/tests/warlock_e2e') != ''
      run: ./build/tests/warlock_e2e
