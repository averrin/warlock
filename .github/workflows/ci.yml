name: Build & Test

on:
  push:
    branches: [ master, main, claude/** ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          git

    - name: Cache build dependencies
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: deps-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
        restore-keys: |
          deps-${{ runner.os }}-

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCPM_SKIP_UPDATE=ON

    - name: Build
      run: cmake --build build --config Release --parallel $(nproc)

    - name: Run unit tests
      run: cd build && ctest --output-on-failure --verbose

    - name: Run e2e tests
      if: success()
      run: |
        if [ -f build/warlock_e2e ]; then
          ./build/warlock_e2e --reporter=compact
        else
          echo "E2E test executable not found, skipping"
        fi
