name: Build & Test

on:
  push:
    branches: [ master, main, claude/** ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git

    - name: Install latest CMake
      run: |
        wget -q https://github.com/Kitware/CMake/releases/download/v3.29.6/cmake-3.29.6-linux-x86_64.tar.gz
        tar xzf cmake-3.29.6-linux-x86_64.tar.gz
        sudo mv cmake-3.29.6-linux-x86_64 /opt/cmake
        sudo ln -sf /opt/cmake/bin/cmake /usr/bin/cmake
        sudo ln -sf /opt/cmake/bin/ctest /usr/bin/ctest

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: ${{ runner.os }}-cmake-deps-${{ hashFiles('cmake/deps.cmake', 'cmake/deps/**') }}
        restore-keys: |
          ${{ runner.os }}-cmake-deps-

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ runner.os }}-ccache-${{ github.ref_name }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.event.pull_request.base.ref || 'master' }}
          ${{ runner.os }}-ccache-master
          ${{ runner.os }}-ccache-

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCPM_SOURCE_CACHE="${GITHUB_WORKSPACE}/build/_deps" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build build --config Release --parallel $(nproc)

    - name: Run unit & serialization tests
      working-directory: build
      run: ctest --output-on-failure --verbose

    - name: Upload e2e binary
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: warlock_e2e
        path: build/warlock_e2e
        if-no-files-found: warn
        retention-days: 1

  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download e2e binary
      uses: actions/download-artifact@v4
      with:
        name: warlock_e2e
        path: build

    - name: Run e2e tests
      working-directory: build
      run: |
        chmod +x warlock_e2e
        ./warlock_e2e
