name: Build & Test

on:
  push:
    branches: [ master, main, claude/** ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          git

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Run unit tests
      run: cd build && ctest --output-on-failure -L unit

    - name: Run e2e tests
      run: |
        if [ -f build/warlock_e2e ]; then
          ./build/warlock_e2e
        else
          echo "E2E test executable not found, skipping"
        fi
